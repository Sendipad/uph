{{- /* AI Assistant Shortcode */ -}}
{{- $pageTitle := .Title -}}
{{- $pageUrl := .Permalink -}}
<style>
  .ai-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin: 1rem 0;
    justify-content: center
  }

  .ai-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s;
    color: white
  }

  .ai-btn-chatgpt {
    background: #10a37f
  }

  .ai-btn-claude {
    background: #a855f7
  }

  .ai-btn-gemini {
    background: #3b82f6
  }

  .ai-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px)
  }
</style>
<div class="ai-actions">
  <a href="https://chatgpt.com/?q={{$pageTitle}}+{{$pageUrl}}" target="_blank" class="ai-btn ai-btn-chatgpt">ChatGPT</a>
  <a href="https://claude.com/" target="_blank" class="ai-btn ai-btn-claude">Claude</a>
  <button onclick="copyGeminiPrompt('{{$pageTitle}}','{{$pageUrl}}')" class="ai-btn ai-btn-gemini">Gemini</button>
</div>
<script>
  function copyGeminiPrompt(title, url) { var p = 'Reading: ' + title + ' ' + url; navigator.clipboard.writeText(p).then(function () { alert('Prompt copied!') }) }
</script>

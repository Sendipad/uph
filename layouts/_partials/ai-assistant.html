{{- /*
AI Assistant Buttons Partial
Creates buttons linking to various AI assistants with context.
*/ -}}
{{- $pageTitle := .Title -}}
{{- $pageUrl := .Permalink -}}
<style>
  .ai-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin: 1rem 0
  }

  .ai-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s;
    color: white
  }

  .ai-btn-chatgpt {
    background: #10a37f
  }

  .ai-btn-claude {
    background: #a855f7
  }

  .ai-btn-gemini {
    background: #3b82f6
  }

  .ai-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px)
  }

  .ai-fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999
  }

  .ai-fab:hover {
    transform: scale(1.05)
  }
</style>
<div class="ai-actions">
  <a href="https://chatgpt.com/?q={{$pageTitle}}+{{$pageUrl}}" target="_blank" class="ai-btn ai-btn-chatgpt"
    title="Ask ChatGPT">ChatGPT</a>
  <a href="https://claude.com/" target="_blank" class="ai-btn ai-btn-claude" title="Ask Claude">Claude</a>
  <button onclick="copyGeminiPrompt('{{$pageTitle}}','{{$pageUrl}}')" class="ai-btn ai-btn-gemini"
    title="Copy prompt for Gemini">Gemini</button>
</div>
<button onclick="showAIMenu()" class="ai-fab" title="AI Assistant">✨</button>
<script>
  function copyGeminiPrompt(title, url) { var p = 'Reading: ' + title + ' ' + url; navigator.clipboard.writeText(p).then(function () { alert('Prompt copied! Paste in Gemini.') }) }
  function showAIMenu() { document.querySelector('.ai-actions').scrollIntoView({ behavior: 'smooth' }) }
</script>

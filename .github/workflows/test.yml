name: UPH Installation & Test CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "develop"

jobs:
  setup:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use setup-bench composite action
        uses: ./.github/actions/setup-bench

      - name: Set up Frappe Bench with ERPNext and UPH
        run: |
          bench init frappe-bench --frappe-branch version-15
          cd frappe-bench
          bench get-app erpnext --branch version-15
          bench get-app uph --branch ${{ github.event.inputs.branch }} https://github.com/Sendipad/uph
          bench new-site test_site --mariadb-root-password root --admin-password admin
          bench --site test_site set-config allow_tests true
          bench --site test_site install-app erpnext
          bench --site test_site execute erpnext.setup.setup_wizard.operations.install_fixtures.install --kwargs "{'country': 'United States'}"
          bench --site test_site install-app uph
          bench --site test_site migrate
          cd ..

      - name: Upload bench folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-folder
          path: frappe-bench

  test:
    needs: setup
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use setup-bench composite action
        uses: ./.github/actions/setup-bench

      - name: Download cached bench
        uses: actions/download-artifact@v4
        with:
          name: bench-folder
          path: frappe-bench

      - name: Overwrite UPH app from current branch
        run: |
          rm -rf frappe-bench/apps/uph
          cp -r uph frappe-bench/apps/uph

      - name: Run UPH tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app uph --skip-test-records || echo "Tests failed but continuing"

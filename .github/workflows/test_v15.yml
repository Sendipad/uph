name: Test v15

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    name: Test v15
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:alpine
        ports:
          - 12000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v1-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v1-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev mariadb-client
          python -m pip install --upgrade pip "setuptools<70" wheel
          pip install frappe-bench

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Initialize Bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench
          cd frappe-bench
          ./env/bin/python -m pip install --upgrade pip "setuptools<70" wheel

      - name: Configure Bench & Install Apps
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:12000
          bench get-app erpnext --branch version-15
          bench get-app uph $GITHUB_WORKSPACE
          ./env/bin/python -m pip install "setuptools<70"
          ./env/bin/python -m pip install -e apps/uph

      - name: Create Site & Setup ERPNext
        working-directory: frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --no-mariadb-socket
          bench --site test_site set-config allow_tests true
          bench --site test_site install-app erpnext
          bench --site test_site install-app uph
          bench --site test_site execute uph.tests.test_utils.setup_erpnext_baseline

      - name: Run Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site run-tests --app uph

      - name: Install Playwright Browsers
        working-directory: frappe-bench
        run: |
          ./env/bin/python -m pip install playwright
          ./env/bin/python -m playwright install --with-deps chromium

      - name: Run QUnit Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site run-ui-tests --headless

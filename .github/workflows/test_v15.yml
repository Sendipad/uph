name: Test v15

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    name: Test v15
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:alpine
        ports:
          - 12000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev mariadb-client

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Frappe Bench
        run: pip install frappe-bench

      - name: Initialize Bench
        run: bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench

      - name: Patch setuptools
        working-directory: frappe-bench
        run: ./env/bin/pip install setuptools

      - name: Configure Bench
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:12000

      - name: Install ERPNext
        working-directory: frappe-bench
        run: bench get-app erpnext --branch version-15

      - name: Install UPH
        working-directory: frappe-bench
        run: bench get-app uph $GITHUB_WORKSPACE

      - name: Create Site
        working-directory: frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --no-mariadb-socket
          bench --site test_site set-config allow_tests true

      - name: Setup ERPNext
        working-directory: frappe-bench
        run: |
          bench --site test_site install-app erpnext
          # Install UPH first (it now handles creating missing ERPNext fixtures like Party Type)
          bench --site test_site install-app uph
          # Then complete ERPNext baseline setup
          bench --site test_site execute uph.tests.test_utils.setup_erpnext_baseline

      - name: Run Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site run-tests --app uph

name: Frappe App Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up the Frappe environment and run tests using the Frappe shared action
      - name: Set up Frappe environment and run tests
        uses: frappe/actions/setup-frappe@v1
        with:
          frappe_branch: 'version-15'  # You can change this to your desired Frappe version
          app_name: 'uph'             # Replace with your app name
          site_name: 'test.local'     # Replace with your site name, can be any name
          db_password: 'root'         # Replace with your database password
          root_password: 'root'       # Replace with your root password

      # Step 3: Run any additional commands, if required
      - name: Run additional tests (optional)
        run: |
          # Replace with any specific commands or test suites you'd like to run
          echo "Running additional tests..."

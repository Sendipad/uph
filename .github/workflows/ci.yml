name: UPH CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'develop'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_PYTHON_GIT_EXECUTABLE: /usr/bin/git
      NODE_ENV: development
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_frappe
      MYSQL_USER: test_frappe
      MYSQL_PASSWORD: test_frappe

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout UPH repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install Redis CLI (for version check)
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Set up Python and Node.js
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get install -y libmariadb-dev git curl

      - name: Install Frappe Bench CLI
        run: |
          pip install --upgrade pip
          pip install frappe-bench wheel

      - name: Initialize Bench with Redis config override
        run: |
          # Create a temporary config to skip Redis version check
          echo '{"redis_server": "redis://localhost:6379"}' > redis_config.json
          bench init frappe-bench \
            --frappe-branch version-15 \
            --skip-assets \
            --python $(which python) \
            --redis-config redis_config.json

      - name: Set up Frappe Bench with ERPNext and UPH
        run: |
          cd frappe-bench
          bench get-app erpnext --branch version-15 --skip-assets
          bench get-app uph --branch develop https://github.com/Sendipad/uph --skip-assets
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --install-app erpnext \
            --install-app uph
          bench --site test_site set-config allow_tests true
          bench --site test_site execute erpnext.setup.setup_wizard.operations.install_fixtures.install --kwargs "{'country': 'United States'}"
          bench --site test_site migrate

      - name: Run Frappe tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app uph

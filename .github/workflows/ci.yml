name: Frappe CI

on:
  push:
    paths:
      - '**.py'
      - '**.js'
      - '**.json'
      - '**.html'
      - '**.vue'
      - '**.md'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

      redis-socketio:
        image: redis:alpine
        ports:
          - 6381:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis npm xvfb libssl-dev wkhtmltopdf curl
          pip install frappe-bench
          bench init --skip-redis-config --frappe-branch version-15 frappe-bench
          cd frappe-bench
          bench get-app erpnext --branch version-15
          bench get-app ../uph  # assuming `uph` is in the root of repo
          bench new-site test-site.local --mariadb-root-password=root --admin-password=admin
          bench --site test-site.local install-app erpnext
          bench --site test-site.local install-app uph

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test-site.local run-tests --app uph

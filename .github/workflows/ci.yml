name: Frappe App Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Deploy Frappe app and run tests
      - name: Deploy Frappe App and Run Tests
        uses: rtCamp/action-deploy-frappe@v1
        with:
          app_name: 'uph'               # Replace with your app name
          site_name: 'test.local'       # Replace with your site name
          db_password: 'root'           # Replace with your database password
          root_password: 'root'         # Replace with your root password

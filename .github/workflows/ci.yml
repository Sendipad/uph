name: Server Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: "0 0 * * *"

jobs:
  server-tests:
    uses: frappe/frappe/.github/workflows/_base-server-tests.yml@develop
    with:
      enable-sqlite: false
      parallel-runs: 2
      enable-coverage: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

name: CI for Frappe App

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis-cache:
            image: redis:alpine
            ports:
              - 13000:6379
      redis-queue:
            image: redis:alpine
            ports:
              - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y redis-server xvfb libmysqlclient-dev
          pip install frappe-bench
          bench init frappe-bench --skip-redis --python python3.10
          cd frappe-bench

          bench get-app --branch version-15 frappe https://github.com/frappe/frappe
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext
          bench get-app --branch version-15 uph https://github.com/Sendipad/uph

          bench new-site test.local --mariadb-root-password root --admin-password admin
          bench --site test.local install-app frappe
          bench --site test.local install-app erpnext
          bench --site test.local install-app uph

          bench build

      - name: Run Tests
        run: |
          cd frappe-bench
          bench --site test.local run-tests --app uph

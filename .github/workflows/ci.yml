name: CI

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
        options: >-
          --requirepass yourpassword
          --protected-mode no
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
        options: >-
          --requirepass yourpassword
          --protected-mode no
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Enable Memory Overcommit
        run: |
          echo "vm.overcommit_memory=1" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Ensure MySQL Service is Running
        run: |
          sudo systemctl stop mysql || true
          sudo rm -rf /var/lib/mysql/*
          sudo systemctl start mysql
          sudo systemctl status mysql || journalctl -xeu mysql.service

      - name: Clean up existing frappe-bench
        run: |
          if [ -d "frappe-bench" ]; then
            echo "Removing existing frappe-bench directory."
            sudo rm -rf frappe-bench
          fi

      - name: Initialize frappe-bench
        run: |
          if [ ! -d "frappe-bench" ]; then
            bench init frappe-bench --skip-assets --python python3.10
            cd frappe-bench
          else
            echo "frappe-bench directory already exists. Skipping initialization."
            cd frappe-bench
          fi

          bench get-app --branch version-15 frappe https://github.com/frappe/frappe
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext
          bench get-app --branch version-15 uph https://github.com/Sendipad/uph

          bench new-site test.local --mariadb-root-password root --admin-password admin
          bench --site test.local install-app frappe
          bench --site test.local install-app erpnext
          bench --site test.local install-app uph

          bench build

      - name: Run Tests
        run: |
          cd frappe-bench
          bench --site test.local run-tests --app uph

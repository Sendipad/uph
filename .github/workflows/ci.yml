name: UPH CI

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_PYTHON_GIT_EXECUTABLE: /usr/bin/git
      NODE_ENV: development
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_frappe
      MYSQL_USER: test_frappe
      MYSQL_PASSWORD: test_frappe

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout UPH repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server libmariadb-dev git curl

      - name: Wait for MariaDB to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" --silent; then
              echo "MariaDB is up!"
              break
            fi
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Install Frappe Bench CLI
        run: |
          pip install frappe-bench

      - name: Set up Frappe Bench with ERPNext and UPH
        run: |
          bench init frappe-bench --frappe-branch version-15
          cd frappe-bench
          bench get-app erpnext --branch version-15
          bench new-site test_site --mariadb-root-password root --admin-password admin
          bench --site test_site install-app erpnext
          bench get-app uph --branch develop --skip-assets --skip-requirements https://github.com/Sendipad/uph
          bench --site test_site install-app uph
          bench build

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app uph

name: UPH App Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Tests
    uses: frappe/frappe/.github/workflows/_base-server-tests.yml@develop
    with:
      python-version: '3.12'
      node-version: 20
      parallel-runs: 4
      enable-postgres: true
      enable-coverage: true

name: Frappe App Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    uses: frappe/frappe/.github/workflows/_base-server-tests.yml@develop
    with:
      # These are just placeholders, replace them with the actual inputs expected by the reusable workflow
      # For example, these could be: 'site', 'app' or whatever the reusable workflow needs
      site: "test.local"                # Replace with actual site parameter if needed
      db_password: ${{ secrets.DB_PASSWORD }}  # Replace with your actual secrets or values
      root_password: ${{ secrets.ROOT_PASSWORD }} # Replace with your root password secret

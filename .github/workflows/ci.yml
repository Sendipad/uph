name: Server Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: "0 0 * * *" # Daily test run

jobs:
  server-tests:
    uses: frappe/frappe/.github/workflows/_base-server-tests.yml@develop
    with:
      app: uph # Your custom app name
      required-apps: erpnext payments # Ensures both are installed
      enable-postgres: false
      parallel-runs: 2
      enable-coverage: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

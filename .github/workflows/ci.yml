name: Frappe CI

on:
  push:
    paths:
      - "**.py"
      - "**.js"
      - "**.json"
      - "**.html"
      - "**.vue"
      - "**.md"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

      redis-socketio:
        image: redis:alpine
        ports:
          - 6381:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev curl

      - name: Install Bench and dependencies
        run: |
          pip install "click<8.1.0" frappe-bench
          bench init --skip-redis-config --frappe-branch version-15 frappe-bench
        shell: bash

      - name: Set up Frappe site
        run: |
          cd frappe-bench
          bench get-app erpnext --branch version-15
          bench get-app ../uph
          bench new-site test-site.local --mariadb-root-password=root --admin-password=admin
          bench --site test-site.local install-app erpnext
          bench --site test-site.local install-app uph
        shell: bash

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test-site.local run-tests --app uph

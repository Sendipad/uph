name: Frappe App Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    uses: frappe/frappe/.github/workflows/_base-server-tests.yml@develop
    with:
      # Directly passing values instead of using secrets
      site: "test.local"              # Replace with your actual site
      db_password: "root"             # Replace with your actual DB password
      root_password: "root"           # Replace with your actual root password

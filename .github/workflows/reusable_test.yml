name: Reusable Test

on:
  workflow_call:
    inputs:
      frappe_branch:
        required: true
        type: string
        default: "develop"
      erpnext_branch:
        required: true
        type: string
        default: "develop"
      python_version:
        required: true
        type: string
        default: "3.14"
      node_version:
        required: true
        type: string
        default: "24"
      mariadb_version:
        required: true
        type: string
        default: "10.11"
      setuptools_version:
        required: true
        type: string
        default: "latest"
      run_python:
        required: false
        type: boolean
        default: true
      run_ui:
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:${{ inputs.mariadb_version }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:alpine
        ports:
          - 12000:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev mariadb-client
          if [ "${{ inputs.setuptools_version }}" != "latest" ]; then
            python -m pip install --upgrade pip "setuptools${{ inputs.setuptools_version }}" wheel
          else
            python -m pip install --upgrade pip setuptools wheel
          fi

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Bench App Mirrors
        id: cache-bench-repos
        uses: actions/cache@v4
        with:
          path: .bench-repo-cache
          key: ${{ runner.os }}-bench-repos-${{ inputs.frappe_branch }}-${{ inputs.erpnext_branch }}-${{ hashFiles('.github/workflows/reusable_test.yml', '**/pyproject.toml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-repos-${{ inputs.frappe_branch }}-${{ inputs.erpnext_branch }}-
            ${{ runner.os }}-bench-repos-${{ inputs.frappe_branch }}-

      - name: Prepare Bench App Mirrors
        run: |
          set -euo pipefail
          mkdir -p .bench-repo-cache

          if [ ! -d .bench-repo-cache/frappe/.git ]; then
            git clone --depth 1 --branch ${{ inputs.frappe_branch }} https://github.com/frappe/frappe.git .bench-repo-cache/frappe
          else
            git -C .bench-repo-cache/frappe fetch origin ${{ inputs.frappe_branch }} --depth 1
            git -C .bench-repo-cache/frappe checkout ${{ inputs.frappe_branch }}
            git -C .bench-repo-cache/frappe reset --hard origin/${{ inputs.frappe_branch }}
          fi

          if [ ! -d .bench-repo-cache/erpnext/.git ]; then
            git clone --depth 1 --branch ${{ inputs.erpnext_branch }} https://github.com/frappe/erpnext.git .bench-repo-cache/erpnext
          else
            git -C .bench-repo-cache/erpnext fetch origin ${{ inputs.erpnext_branch }} --depth 1
            git -C .bench-repo-cache/erpnext checkout ${{ inputs.erpnext_branch }}
            git -C .bench-repo-cache/erpnext reset --hard origin/${{ inputs.erpnext_branch }}
          fi

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Frappe Bench & Dependencies
        run: pip install frappe-bench

      - name: Initialize Bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-path $GITHUB_WORKSPACE/.bench-repo-cache/frappe --frappe-branch ${{ inputs.frappe_branch }} frappe-bench || bench init --skip-redis-config-generation --skip-assets --frappe-branch ${{ inputs.frappe_branch }} frappe-bench
          if [ "${{ inputs.setuptools_version }}" != "latest" ]; then
            cd frappe-bench
            ./env/bin/python -m pip install --upgrade pip "setuptools${{ inputs.setuptools_version }}" wheel
          fi

      - name: Configure Bench
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:12000

      - name: Install ERPNext
        working-directory: frappe-bench
        run: bench get-app erpnext $GITHUB_WORKSPACE/.bench-repo-cache/erpnext --branch ${{ inputs.erpnext_branch }} || bench get-app erpnext --branch ${{ inputs.erpnext_branch }}

      - name: Install UPH
        working-directory: frappe-bench
        run: |
          bench get-app uph $GITHUB_WORKSPACE
          if [ "${{ inputs.setuptools_version }}" != "latest" ]; then
            ./env/bin/python -m pip install "setuptools${{ inputs.setuptools_version }}"
            ./env/bin/python -m pip install -e apps/uph
          fi

      - name: Create Site
        working-directory: frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site test_site set-config allow_tests true

      - name: Setup ERPNext & UPH
        working-directory: frappe-bench
        run: |
          bench --site test_site install-app erpnext
          bench --site test_site install-app uph
          # Create deterministic ERPNext baseline data via test utility helper.
          # Keep this after app installation so bench execute can reliably import uph modules.
          bench --site test_site execute uph.tests.test_utils.setup_erpnext_baseline

      - name: Build Assets (UI runs only)
        if: ${{ inputs.run_ui }}
        working-directory: frappe-bench
        run: bench build --app uph

      - name: Run Python Tests
        if: ${{ inputs.run_python }}
        working-directory: frappe-bench
        run: |
          bench --site test_site run-tests --app uph

      - name: Cache Yarn
        if: ${{ inputs.run_ui }}
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Cypress Binary
        if: ${{ inputs.run_ui }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Run UI Tests
        if: ${{ inputs.run_ui }}
        working-directory: frappe-bench
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          bench --site test_site serve --port 8000 --noreload > /tmp/bench-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://test_site:8000/api/method/ping >/dev/null; then
              break
            fi
            sleep 2
          done
          bench --site test_site run-ui-tests uph --headless

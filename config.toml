baseURL = "https://sendipad.github.io/uph/"
title = "Unified Party Hub"
theme = "book"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
languageCode = "en-us"
disablePathToLower = true
enableGitInfo = true

# Needed for mermaid/katex shortcodes and HTML tags within markdown
[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = 'base16-snazzy'
  
[params]
  BookLogo = "uph-logo.png"
  BookSearch = true
  BookSection = 'docs'
  BookSearchIndex = true
  BookEdit = true
  BookRepo = "https://github.com/sendipad/uph"
  
  # KEEP BookLastChangeLink as is (uses Hugo templating)
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'
  
  # FIXED: Use simple relative path for BookEditPath. 
  # The custom override partial (edit.html) will handle the complex stripping.
  BookEditPath = "edit/docs/" 
  
  BookDateFormat = 'January 2, 2006'
  BookTheme = "auto"
  customCSS = ["custom.css"]

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content.en"
  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content.ar"
    languageDirection = "rtl"

# FIXED: Use standard [[menu.main]] for the primary sidebar navigation
[menu]
  [[menu.main]]
    name = 'Documentation'
    pageRef = '/docs/introduction/' # Use a specific page or the root '/'
    weight = 1

  # Nested items often rely on the directory structure, but can be defined explicitly:
  [[menu.main]]
    name = 'Example'
    pageRef = '/docs/example/'
    weight = 10
    parent = 'Documentation'

  [[menu.main]]
    name = 'UseCases'
    pageRef = '/docs/shortcodes/buttons/'
    weight = 20
    parent = 'Documentation'

  [[menu.main]]
    name = 'Showcases'
    pageRef = '/showcases/'
    weight = 2

  [[menu.main]]
    name = 'GitHub (Top Link)'
    url = 'https://github.com/Sendipad/uph/'
    weight = 3

# [[menu.after]] is correct for a menu block after the main sidebar content
[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/Sendipad/uph/'
  weight = 10

[taxonomies]
  tag = "tags"
  category = "categories"

# ===============================================
# Hugo Site Configuration (config.toml)
# ===============================================

baseURL = "https://sendipad.github.io/uph/"
title = "Unified Party Hub"
theme = "book"
languageCode = "en-us"
disablePathToLower = true
enableGitInfo = true

# Multi-language Configuration
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true # Enables /en/ and /ar/ subdirectories

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content.en"
  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content.ar"
    languageDirection = "rtl" # Sets right-to-left layout for Arabic

# ===============================================
# Markup Configuration (Required for shortcodes and HTML)
# ===============================================

[markup]
  [markup.goldmark.renderer]
    unsafe = true # Allows raw HTML tags (like <strong>) and complex shortcodes
  
  [markup.tableOfContents]
    startLevel = 1 # Start TOC generation at H1

  [markup.highlight]
    style = 'base16-snazzy'

# ===============================================
# Theme Parameters (params)
# ===============================================

[params]
  BookLogo = "uph-logo.png"
  BookSearch = true
  BookSection = '*' # Tells the theme where the main documentation lives
  BookSearchIndex = true
  BookDateFormat = 'January 2, 2006'
  BookTheme = "light"
  customCSS = ["custom.css"]
  
  # --- GitHub Repository Settings ---
  BookEdit = true
  BookRepo = "https://github.com/sendipad/uph"
  
  # BookEditPath is simplified here because the custom partial handles the stripping.
  # If you remove the partial, change this to the full template string.
  BookEditPath = "edit/docs/" 
  
  # Last change link template
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'
  
# ===============================================
# Menu Configuration (Sidebar Navigation)
# ===============================================

[menu]
  # Primary Sidebar Menu Items
  [[menu.main]]
    name = 'Documentation'
    pageRef = '/docs/introduction/'
    weight = 1

  # Note: The 'Example' and 'UseCases' will only appear if their parent page 
  # ('Documentation') is rendered as an expand/collapse item.
  [[menu.main]]
    name = 'Example'
    pageRef = '/docs/example/'
    weight = 10
    parent = 'Documentation'

  [[menu.main]]
    name = 'UseCases'
    pageRef = '/docs/shortcodes/buttons/'
    weight = 20
    parent = 'Documentation'

  [[menu.main]]
    name = 'Showcases'
    pageRef = '/showcases/'
    weight = 2

  [[menu.main]]
    name = 'Blog' # New main link to your blog section
    pageRef = '/posts/'
    weight = 50

  [[menu.main]]
    name = 'GitHub (Top Link)'
    url = 'https://github.com/Sendipad/uph/'
    weight = 4
    # Optional: pre = "<i class='fab fa-github'></i> " 

  # Menu items to appear after the main navigation block (e.g., permanent links)
  [[menu.after]]
    name = 'GitHub'
    url = 'https://github.com/Sendipad/uph/'
    weight = 10

# ===============================================
# Taxonomies
# ===============================================

[taxonomies]
  tag = "tags"
  category = "categories"

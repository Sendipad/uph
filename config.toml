baseURL = "https://sendipad.github.io/uph/"
title = "Unified Party Hub"
theme = "book"
languageCode = "en-us"
disablePathToLower = true
enableGitInfo = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content.en"

  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content.ar"
    languageDirection = "rtl"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
  [markup.highlight]
    style = "base16-snazzy"

[params]
  BookLogo = "uph-logo.png"
  BookTheme = "light"
  BookSearch = true
  BookSearchIndex = true
  BookSection = "docs"
  BookFlat = true
  BookDateFormat = "January 2, 2006"
  customCSS = ["custom.css", "css/landing.css"]
  BookEdit = true
  BookRepo = "https://github.com/Sendipad/uph"
  BookEditPath = "edit/main/"
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

[menu]
  [[menu.main]]
    name = "🏠 Home"
    pageRef = "/"
    weight = 1

  [[menu.main]]
    name = "📘 Documentation"
    pageRef = "/docs/"
    weight = 2

  [[menu.main]]
    name = "🚀 Introduction"
    pageRef = "/docs/introduction/"
    parent = "📘 Documentation"
    weight = 1

  [[menu.main]]
    name = "🏗️ Architecture"
    pageRef = "/docs/architecture/"
    parent = "📘 Documentation"
    weight = 2

  [[menu.main]]
    name = "🧩 Modules"
    pageRef = "/docs/modules/"
    parent = "📘 Documentation"
    weight = 3

  [[menu.main]]
    name = "🛠️ API Reference"
    pageRef = "/docs/api/"
    parent = "📘 Documentation"
    weight = 4

  [[menu.main]]
    name = "⚙️ Operations"
    pageRef = "/docs/operations/"
    parent = "📘 Documentation"
    weight = 5

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/Sendipad/uph/"
    weight = 100

  [[menu.after]]
    name = "GitHub"
    url = "https://github.com/Sendipad/uph/"
    weight = 10

[taxonomies]
  tag = "tags"
  category = "categories"

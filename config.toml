# ===============================================
# Hugo Site Configuration
# ===============================================

baseURL = "https://sendipad.github.io/uph/"
title = "Unified Party Hub"
theme = "book"
languageCode = "en-us"
disablePathToLower = true
enableGitInfo = true

# Enable multilingual structure: /en/ and /ar/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content.en"

  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content.ar"
    languageDirection = "rtl"

# ===============================================
# Markup Configuration
# ===============================================

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    startLevel = 1

  [markup.highlight]
    style = "base16-snazzy"

# ===============================================
# Theme Parameters
# ===============================================

[params]
  BookLogo = "uph-logo.png"
  BookTheme = "light"
  BookSearch = true
  BookSearchIndex = true

  # Automatically include all sections (docs + posts)
  BookSection = "*"  
  BookFlat = true            # Allows manual menu items to appear
  BookDateFormat = "January 2, 2006"
  customCSS = ["custom.css"]

  # GitHub integration
  BookEdit = true
  BookRepo = "https://github.com/Sendipad/uph"
  BookEditPath = "edit/docs/"
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

# ===============================================
# Sidebar & Top Menu Configuration
# ===============================================

[menu]

  # ---- Documentation Root Section ----
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs/introduction/"
    weight = 1

  [[menu.main]]
    name = "Example"
    pageRef = "/docs/example/"
    parent = "Docs"
    weight = 10

  [[menu.main]]
    name = "UseCases"
    pageRef = "/docs/shortcodes/buttons/"
    parent = "Docs"
    weight = 20

  # ---- Blog Section (Sidebar Link) ----
  [[menu.main]]
    name = "Posts"
    pageRef = "/posts/"
    weight = 50

  # ---- Showcases Section ----
  [[menu.main]]
    name = "Showcases"
    pageRef = "/showcases/"
    weight = 60

  # ---- GitHub Quick Link ----
  [[menu.main]]
    name = "GitHub (Top Link)"
    url = "https://github.com/Sendipad/uph/"
    weight = 100

  # Footer area
  [[menu.after]]
    name = "GitHub"
    url = "https://github.com/Sendipad/uph/"
    weight = 10

# ===============================================
# Taxonomies
# ===============================================

[taxonomies]
  tag = "tags"
  category = "categories"

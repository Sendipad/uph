# ===============================================
# Hugo Site Configuration
# ===============================================

baseURL = "https://sendipad.github.io/uph/"
title = "Unified Party Hub"
theme = "book"
languageCode = "en-us"
disablePathToLower = true
enableGitInfo = true

# Enable multilingual structure: /en/ and /ar/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content.en"

  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content.ar"
    languageDirection = "rtl"

# ===============================================
# Markup Configuration
# ===============================================

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    startLevel = 1

  [markup.highlight]
    style = "base16-snazzy"

# ===============================================
# Theme Parameters
# ===============================================

[params]
  BookLogo = "uph-logo.png"
  BookTheme = "light"
  BookSearch = true
  BookSearchIndex = true

  # Automatically include all sections (docs + posts)
  BookSection = "docs"  
  BookFlat = true            # Allows manual menu items to appear
  BookDateFormat = "January 2, 2006"
  customCSS = ["custom.css", "css/landing.css"]

  # GitHub integration
  BookEdit = true
  BookRepo = "https://github.com/Sendipad/uph"
  BookEditPath = "edit/docs/"
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

